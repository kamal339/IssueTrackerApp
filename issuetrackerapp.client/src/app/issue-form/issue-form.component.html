<h2 mat-dialog-title>Add/Edit Issue</h2>
<mat-dialog-content class="mat-typography">
  <form (ngSubmit)="onSubmit()">
    <label for="title">Title</label>
    <input type="text" id="title" [(ngModel)]="issue.title" name="title" required class="form-control">
    <br />
    <Label for="description">Description</Label>
    <textarea id="description" [(ngModel)]="issue.description" name="description" required class="form-control"></textarea>
    <br />
    <label for="status">Status</label>
    <select id="status" [(ngModel)]="issue.status" name="status" required class="form-control">
      <option value="Open">Open</option>
      <option value="InProgress">InProgress</option>
      <option value="Closed">Closed</option>
    </select>
    <br />
    <Label for="priority">Priority</Label>
    <select id="priority" [(ngModel)]="issue.priority" name="priority" required class="form-control">
      <option value="High">High</option> <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <br />
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
    {{message}}
  </form>
</mat-dialog-content>
